<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnchorRead PDF Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, serif;
      background: #525659;
      color: #1a1a1a;
    }

    /* ── Toolbar ── */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: #323639;
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .toolbar .logo {
      font-size: 15px;
      font-weight: 700;
    }
    .toolbar .logo b { color: #60a5fa; }

    .toolbar .title {
      flex: 1;
      font-size: 13px;
      color: #9ca3af;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toolbar label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    .toolbar input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #60a5fa;
    }

    .toolbar .page-info {
      font-size: 12px;
      color: #9ca3af;
    }

    /* ── Content ── */
    #content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
    }

    .pdf-page {
      width: 816px;  /* US Letter width at ~96dpi */
      min-height: 1056px;
      background: #fff;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      margin-bottom: 20px;
      padding: 72px 72px;  /* 1-inch margins */
      font-size: 14px;
      line-height: 1.6;
    }

    .pdf-page p {
      margin-bottom: 0.8em;
      text-align: justify;
    }

    /* ── Loading / Error ── */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #9ca3af;
      font-size: 16px;
    }

    .loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #4b5563;
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #fca5a5;
      font-size: 16px;
    }

    .error a {
      color: #60a5fa;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <!-- Toolbar -->
  <div class="toolbar" id="toolbar">
    <div class="logo"><b>Anchor</b>Read</div>
    <div class="title" id="pdfTitle">Loading...</div>
    <label>
      <input type="checkbox" id="toggleBold" checked>
      Fixation Mode
    </label>
    <div class="page-info" id="pageInfo"></div>
  </div>

  <!-- Loading state -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>Loading PDF...</div>
  </div>

  <!-- Error state -->
  <div class="error" id="error" style="display:none">
    <div id="errorMsg"></div>
    <a href="#" id="backLink">← Go back</a>
  </div>

  <!-- PDF content -->
  <div id="content"></div>

  <script src="lib/pdf.min.js"></script>
  <script src="pdf-viewer.js"></script>
</body>
</html>
