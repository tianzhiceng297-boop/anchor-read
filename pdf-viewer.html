<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnchorRead PDF Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, serif;
      background: #525659;
      color: #1a1a1a;
    }

    /* ── Toolbar ── */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: #323639;
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .toolbar .logo { font-size: 15px; font-weight: 700; }
    .toolbar .logo b { color: #60a5fa; }

    .toolbar .title {
      flex: 1;
      font-size: 13px;
      color: #9ca3af;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toolbar label {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; cursor: pointer;
    }
    .toolbar input[type="checkbox"] { width: 16px; height: 16px; accent-color: #60a5fa; }
    .toolbar .page-info { font-size: 12px; color: #9ca3af; }

    .toolbar .open-btn {
      padding: 4px 10px;
      background: #4b5563;
      color: #e5e7eb;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    .toolbar .open-btn:hover { background: #6b7280; }

    /* ── Content ── */
    #content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0 60px;
    }

    .pdf-page {
      width: 816px;
      min-height: 1056px;
      background: #fff;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      margin-bottom: 20px;
      padding: 72px 72px;
      font-size: 14px;
      line-height: 1.6;
    }

    .pdf-page p { margin-bottom: 0.8em; text-align: justify; }

    /* ── Loading ── */
    .loading {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: calc(100vh - 44px);
      color: #9ca3af; font-size: 16px;
    }
    .loading .spinner {
      width: 40px; height: 40px;
      border: 3px solid #4b5563; border-top-color: #60a5fa;
      border-radius: 50%; animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Drop Zone ── */
    .drop-zone {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: calc(100vh - 44px);
      text-align: center;
    }
    .drop-zone.hidden { display: none; }

    .drop-box {
      width: 480px;
      padding: 60px 40px;
      border: 2px dashed #6b7280;
      border-radius: 12px;
      background: #3b3f42;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .drop-box:hover, .drop-box.drag-over {
      border-color: #60a5fa;
      background: #404548;
    }
    .drop-box .drop-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.6;
    }
    .drop-box .drop-title {
      font-size: 16px;
      color: #e5e7eb;
      margin-bottom: 8px;
    }
    .drop-box .drop-hint {
      font-size: 13px;
      color: #9ca3af;
    }
    .drop-box input[type="file"] { display: none; }

    .drop-error {
      margin-top: 12px;
      font-size: 13px;
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <!-- Toolbar (hidden until PDF loaded) -->
  <div class="toolbar" id="toolbar" style="display:none">
    <div class="logo"><b>Anchor</b>Read</div>
    <div class="title" id="pdfTitle">PDF Document</div>
    <label><input type="checkbox" id="toggleBold" checked> Fixation</label>
    <div class="page-info" id="pageInfo"></div>
    <button class="open-btn" id="openFileBtn">Open another</button>
  </div>

  <!-- Loading (hidden until file selected) -->
  <div class="loading" id="loading" style="display:none">
    <div class="spinner"></div>
    <div>Loading PDF...</div>
  </div>

  <!-- Drop zone (shown by default) -->
  <div class="drop-zone" id="dropZone">
    <div class="drop-box" id="dropBox">
      <div class="drop-icon">📄</div>
      <div class="drop-title">Drop PDF here</div>
      <div class="drop-hint">or click to select a file</div>
      <input type="file" id="fileInput" accept=".pdf">
    </div>
    <div class="drop-error" id="dropError"></div>
  </div>

  <!-- PDF content -->
  <div id="content"></div>

  <script src="lib/pdf.min.js"></script>
  <script src="pdf-viewer.js"></script>
</body>
</html>
